on:
  schedule:
    # Jalan otomatis tiap 6 jam
    - cron: '0 */6 * * *'
  workflow_dispatch: # Biar bisa di-run manual pake tombol

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download Playlist
        run: |
          mkdir -p px
          curl -L -A "Mozilla/5.0" -o px/ram2 "https://iptv.amritv.my.id/script/rbtv/getplaylist.php"
          
          if ! head -n 1 px/ram2 | grep -q "#EXTM3U"; then
            echo "Gagal! File bukan playlist"
            cat px/ram2
            exit 1
          fi
          
          echo "Berhasil, total channel:"
          grep -c "#EXTINF" px/ram2

      - name: Filter Live Only & Edit Nama
        run: |
          python3 << 'PY'
          import re

          # ==========================================
          # >>> SETTING DI SINI AJA, GANTI DI SINI <<<
          # ==========================================

          # 1. Nama Kategori - mau ganti jadi apa?
          NAMA_KATEGORI = "Live Now"

          # 2. Prefix Live di depan nama siaran
          # Contoh nama asli di playlist: "🔴 [Live] RCTI"
          # Kalau mau GANTI jadi lain, isi di bawah ini:
          # Contoh: PREFIX_BARU = "● LIVE - "
          # Contoh: PREFIX_BARU = "[SIARAN LANGSUNG] "
          # Kalau mau HAPUS TOTAL prefixnya (jadi cuma "RCTI" aja), isi kosong:
          PREFIX_BARU = "🟢 Live "  # <-- GANTI DI SINI

          # Ini daftar prefix lama yang mau dibersihin / diganti
          # Kalau di sumber ada variasi lain, tambahin aja di sini
          PREFIX_LAMA_LIST = [
              "🔴 [Live] ",
              "🔴 [LIVE] ",
              "🔴 [Live]",
              "🔴[Live] ",
              "[Live] ",
              "[LIVE] ",
              "🔴 LIVE ",
              "🔴 Live ",
              "🔴 ",
              "● LIVE ",
          ]
          # ==========================================
          # >>> SAMPAI SINI AJA, BAWAHNYA JANGAN DIUBAH <<<
          # ==========================================

          input_file = "px/ram2"
          output_file = "px/ram2.tmp"

          with open(input_file, 'r', encoding='utf-8', errors='ignore') as f:
              lines = f.readlines()

          header = lines[0] if lines and lines[0].startswith('#EXTM3U') else '#EXTM3U\n'
          new_lines = [header]
          kept = 0
          skipped_upcoming = 0

          i = 1
          while i < len(lines):
              line = lines[i].strip()

              if line.startswith('#EXTINF'):
                  url_lines = []
                  j = i + 1
                  while j < len(lines):
                      next_line = lines[j].strip()
                      if next_line == "" or next_line.startswith('#EXTVLCOPT'):
                          url_lines.append(lines[j])
                          j += 1
                          continue
                      break

                  url = lines[j].strip() if j < len(lines) else ""
                  low = line.lower()

                  # 1. BUANG yang Upcoming
                  if 'upcoming' in low or 'up coming' in low or 'coming soon' in low:
                      skipped_upcoming += 1
                      i = j + 1
                      continue

                  # 2. Pisahin atribut dan nama channel
                  # Format EXTINF: #EXTINF:-1 tvg-id="..." group-title="..." ,NAMA CHANNEL
                  # Nama channel ada setelah koma terakhir
                  if ',' in line:
                      atribut, nama_channel = line.rsplit(',', 1)
                  else:
                      atribut, nama_channel = line, ""

                  nama_channel = nama_channel.strip()

                  # 3. GANTI / HAPUS prefix 🔴 [Live] di awal nama
                  # Bersihin dulu prefix lama yang ada
                  nama_bersih = nama_channel
                  for prefix_lama in PREFIX_LAMA_LIST:
                      if nama_bersih.startswith(prefix_lama):
                          nama_bersih = nama_bersih[len(prefix_lama):].strip()
                          break
                      # Jaga-jaga kalau ada spasi / karakter aneh di depan
                      if nama_bersih.lstrip().startswith(prefix_lama.strip()):
                          nama_bersih = nama_bersih.lstrip()[len(prefix_lama.strip()):].strip()
                          break

                  # Pasang prefix baru (kalau PREFIX_BARU kosong, berarti dihapus total)
                  if PREFIX_BARU:
                      nama_final = f"{PREFIX_BARU}{nama_bersih}"
                  else:
                      nama_final = nama_bersih

                  # 4. JADIKAN 1 KATEGORI
                  if 'group-title=' in atribut:
                      atribut = re.sub(r'group-title="[^"]*"', f'group-title="{NAMA_KATEGORI}"', atribut)
                  else:
                      atribut = atribut.replace('#EXTINF:-1', f'#EXTINF:-1 group-title="{NAMA_KATEGORI}"', 1)

                  line_baru = f"{atribut},{nama_final}"

                  new_lines.append(line_baru + '\n')
                  for ul in url_lines:
                      new_lines.append(ul)
                  if url:
                      new_lines.append(url + '\n')
                      kept += 1

                  i = j + 1
              else:
                  i += 1

          with open(output_file, 'w', encoding='utf-8') as f:
              f.writelines(new_lines)

          import shutil
          shutil.move(output_file, input_file)
          print(f"Kept (Live): {kept}")
          print(f"Skipped (Upcoming): {skipped_upcoming}")
          PY

          echo "Sisa setelah filter:"
          grep -c "#EXTINF" px/ram2 || echo "0 - tidak ada yang Live"

      - name: Commit & Push
        run: |
          git config --local user.email "bot@github.com"
          git config --local user.name "Pl Bot"
          git add px/ram2
          git diff --cached --quiet || git commit -m "Update - $(date +'%d-%m-%Y %H:%M')"
          git push
