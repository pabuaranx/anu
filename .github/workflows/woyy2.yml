on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download Pl
        run: |
          mkdir -p px
          curl -L -A "Mozilla/5.0" -o px/ram2 "https://iptv.amritv.my.id/script/rbtv/getplaylist.php"
          
          if ! head -n 1 px/ram2 | grep -q "#EXTM3U"; then
            echo "Gagal! File bukan playlist"
            cat px/ram2
            exit 1
          fi

      - name: Filter Live + Edit Nama + Logo + Tambah Donasi di Awal
        run: |
          python3 << 'PY'
          import re

          # ==========================================
          # >>> SETTING DI SINI AJA <<<
          # ==========================================

          NAMA_KATEGORI = "LIVE NOW"
          PREFIX_BARU = "[ 🟢 LIVE ] "
          PREFIX_LAMA_LIST = [
              "🔴 [Live] ", "🔴 [LIVE] ", "🔴 [Live]", "🔴[Live] ",
              "[Live] ", "[LIVE] ", "🔴 LIVE ", "🔴 Live ", "🔴 ", "● LIVE ",
          ]

          LOGO_DEFAULT = "https://defira.my.id/sett/ev.jpeg"
          LOGO_PER_CHANNEL = {
              # "RCTI": "https://contoh.com/rcti.png",
          }

          # --- SIARAN PERTAMA (PALING ATAS) ---
          # Kalau mau ganti siaran pertama, ganti di sini aja
          # Formatnya harus 2 baris: baris #EXTINF dan baris link-nya
          SIARAN_PERTAMA_EXTINF = '#EXTINF:-1 tvg-id="" tvg-name="Donasi ++" tvg-logo="https://static.vecteezy.com/system/resources/previews/054/224/335/non_2x/charity-icon-colored-outline-icon-style-hand-giving-money-icon-related-to-donation-and-charity-donation-elements-illustration-vector.jpg" group-title="INDONESIA",Donasi ++'
          SIARAN_PERTAMA_URL = 'https://github.com/rohmanabdu/cloudd/raw/refs/heads/main/awal.mp4'

          # ==========================================
          # >>> SAMPAI SINI AJA <<<
          # ==========================================

          input_file = "px/ram2"
          output_file = "px/ram2.tmp"

          with open(input_file, 'r', encoding='utf-8', errors='ignore') as f:
              lines = f.readlines()

          header = lines[0] if lines and lines[0].startswith('#EXTM3U') else '#EXTM3U\n'
          
          # Kita siapkan list baru, langsung isi siaran pertama di awal
          new_lines = [header]
          
          # --- MASUKIN SIARAN PERTAMA ---
          # Cek dulu biar ga double kalau di playlist asli sudah ada Donasi
          new_lines.append(SIARAN_PERTAMA_EXTINF + '\n')
          new_lines.append(SIARAN_PERTAMA_URL + '\n')

          kept = 0
          i = 1
          while i < len(lines):
              line = lines[i].strip()
              if line.startswith('#EXTINF'):
                  url_lines = []
                  j = i + 1
                  while j < len(lines):
                      next_line = lines[j].strip()
                      if next_line == "" or next_line.startswith('#EXTVLCOPT'):
                          url_lines.append(lines[j]); j += 1; continue
                      break
                  url = lines[j].strip() if j < len(lines) else ""
                  low = line.lower()

                  if 'upcoming' in low or 'up coming' in low or 'coming soon' in low:
                      i = j + 1; continue

                  if ',' in line:
                      atribut, nama_channel = line.rsplit(',', 1)
                  else:
                      atribut, nama_channel = line, ""
                  nama_channel = nama_channel.strip()

                  # Skip kalau di playlist asli sudah ada Donasi, biar ga double
                  if 'donasi' in nama_channel.lower():
                      i = j + 1; continue

                  # Bersihin prefix lama
                  nama_bersih = nama_channel
                  for p in PREFIX_LAMA_LIST:
                      if nama_bersih.startswith(p):
                          nama_bersih = nama_bersih[len(p):].strip(); break
                      if nama_bersih.lstrip().startswith(p.strip()):
                          nama_bersih = nama_bersih.lstrip()[len(p.strip()):].strip(); break
                  
                  nama_final = f"{PREFIX_BARU}{nama_bersih}" if PREFIX_BARU else nama_bersih

                  if 'group-title=' in atribut:
                      atribut = re.sub(r'group-title="[^"]*"', f'group-title="{NAMA_KATEGORI}"', atribut)
                  else:
                      atribut = atribut.replace('#EXTINF:-1', f'#EXTINF:-1 group-title="{NAMA_KATEGORI}"', 1)

                  logo_mau_dipakai = LOGO_PER_CHANNEL.get(nama_bersih, LOGO_PER_CHANNEL.get(nama_final, ""))
                  if not logo_mau_dipakai:
                      logo_mau_dipakai = LOGO_DEFAULT

                  if logo_mau_dipakai:
                      if 'tvg-logo=' in atribut:
                          atribut = re.sub(r'tvg-logo="[^"]*"', f'tvg-logo="{logo_mau_dipakai}"', atribut)
                      else:
                          atribut = atribut.replace('#EXTINF:-1', f'#EXTINF:-1 tvg-logo="{logo_mau_dipakai}"', 1)

                  line_baru = f"{atribut},{nama_final}"
                  new_lines.append(line_baru + '\n')
                  for ul in url_lines:
                      new_lines.append(ul)
                  if url:
                      new_lines.append(url + '\n'); kept += 1
                  i = j + 1
              else:
                  i += 1

          with open(output_file, 'w', encoding='utf-8') as f:
              f.writelines(new_lines)
          import shutil; shutil.move(output_file, input_file)
          print(f"Kept (Live): {kept} + 1 Donasi di awal")
          PY

      - name: Commit & Push
        run: |
          git config --local user.email "bot@github.com"
          git config --local user.name "Pl Bot"
          git add px/ram2
          git diff --cached --quiet || git commit -m "Update - $(date +'%d-%m-%Y %H:%M')"
          git push
